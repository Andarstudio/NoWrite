name: Build NoWrite for Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    env:
      PROJECT_FILE: codes/NoWrite.csproj   # change if your .csproj is elsewhere

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT_FILE" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            --output publish/win-x64
          if ($LASTEXITCODE -ne 0) { throw "NoWrite publish failed." }
          if (!(Get-ChildItem publish/win-x64 -Filter *.exe)) { throw "No executable was produced." }

      - uses: actions/upload-artifact@v4
        with:
          name: NoWrite-win-x64
          path: publish/win-x64
