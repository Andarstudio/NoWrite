name: Build NoWrite for Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    env:
      PROJECT_FILE: codes/NoWrite.csproj

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $OutputDir = Join-Path $env:GITHUB_WORKSPACE "publish\win-x64"

          dotnet publish "$env:PROJECT_FILE" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            --output "$OutputDir"

          if ($LASTEXITCODE -ne 0) { throw "NoWrite publish failed." }

          $exe = Get-ChildItem -Path $OutputDir -Filter "NoWrite.exe"
          if (!$exe) { throw "NoWrite.exe was not produced." }

          $final = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Path $final -Force | Out-Null
          Copy-Item $exe.FullName $final

      - uses: actions/upload-artifact@v4
        with:
          name: NoWrite-win-x64
          path: release/NoWrite.exe
